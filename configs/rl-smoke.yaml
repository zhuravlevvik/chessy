format: chessy-config-v1
name: rl-smoke
seed: 42
device: cpu
model: {architecture: residual-cnn-v1, input_planes: 119, action_planes: 73, board_size: 8, channels: 8, residual_blocks: 1, group_norm_groups: 8, value_channels: 8, value_hidden: 16, value_classes: 3}
optimizer: {type: adamw, learning_rate: 0.0003, weight_decay: 0.0001, beta1: 0.9, beta2: 0.999, epsilon: 0.00000001}
scheduler: {type: warmup-cosine, warmup_steps: 1, total_steps: 4, minimum_lr_ratio: 0.0}
training: {batch_size: 2, gradient_clip_norm: 1.0, snapshot_every_steps: 2, keep_last_periodic: 2}
artifacts: {runs_dir: runs, dataset_manifest: null, replay_manifest: null, league_manifest: null}
self_play:
  actors: 1
  games_per_generation: 2
  simulations: 4
  c_puct: 1.5
  root_noise: true
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: {initial: 1.0, cutoff_ply: 8, final: 0.0}
  max_game_plies: 16
  inference_batch_size: 4
  inference_wait_ms: 1.0
replay: {root_dir: replay, samples_per_segment: 16, active_max_samples: 64, recent_fraction: 0.5, recent_generations: 2, cache_segments: 2}
rl: {policy_loss_weight: 1.0, value_loss_weight: 1.0, train_steps_per_generation: 2, batch_size: 2, gradient_clip_norm: 1.0}
curriculum: {initial_stage: endgames, stage_mode: manual, stage_mix: {endgames: 1.0, reduced: 0.0, full: 0.0}}
evaluation: {games_per_match: 2, simulations: 4, promotion_min_score: 0.55, promotion_min_games: 40}
observer: {enabled: true, archive_every_generations: 1, live_game_index: 0}
