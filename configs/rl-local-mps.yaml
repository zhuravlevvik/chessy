# Conservative starting point for manual MPS benchmarking, not a strength claim.
format: chessy-config-v1
name: rl-local-mps
seed: 42
device: mps
model: {architecture: residual-cnn-v1, input_planes: 119, action_planes: 73, board_size: 8, channels: 96, residual_blocks: 8, group_norm_groups: 8, value_channels: 32, value_hidden: 128, value_classes: 3}
optimizer: {type: adamw, learning_rate: 0.0003, weight_decay: 0.0001, beta1: 0.9, beta2: 0.999, epsilon: 0.00000001}
scheduler: {type: warmup-cosine, warmup_steps: 100, total_steps: 1000, minimum_lr_ratio: 0.0}
training: {batch_size: 64, gradient_clip_norm: 1.0, snapshot_every_steps: 100, keep_last_periodic: 2}
artifacts: {runs_dir: runs, dataset_manifest: null, replay_manifest: null, league_manifest: null}
self_play: {actors: 2, games_per_generation: 16, simulations: 64, c_puct: 1.5, root_noise: true, dirichlet_alpha: 0.3, dirichlet_epsilon: 0.25, temperature: {initial: 1.0, cutoff_ply: 20, final: 0.0}, max_game_plies: 160, inference_batch_size: 32, inference_wait_ms: 2.0}
replay: {root_dir: replay, samples_per_segment: 16384, active_max_samples: 250000, recent_fraction: 0.5, recent_generations: 2, cache_segments: 2}
rl: {policy_loss_weight: 1.0, value_loss_weight: 1.0, train_steps_per_generation: 250, batch_size: 64, gradient_clip_norm: 1.0}
curriculum: {initial_stage: endgames, stage_mode: manual, stage_mix: {endgames: 1.0, reduced: 0.0, full: 0.0}}
evaluation: {games_per_match: 40, simulations: 96, promotion_min_score: 0.55, promotion_min_games: 40}
