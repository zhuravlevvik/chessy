format: chessy-config-v1
name: personal-feedback-local-mps
seed: 7
device: mps
model: {architecture: residual-cnn-v1, input_planes: 119, action_planes: 73, board_size: 8, channels: 96, residual_blocks: 8, group_norm_groups: 8, value_channels: 32, value_hidden: 128, value_classes: 3}
optimizer: {type: adamw, learning_rate: 0.0001, weight_decay: 0.0001, beta1: 0.9, beta2: 0.999, epsilon: 0.00000001}
scheduler: {type: warmup-cosine, warmup_steps: 100, total_steps: 5000, minimum_lr_ratio: 0.1}
training: {batch_size: 128, gradient_clip_norm: 1.0, snapshot_every_steps: 100, keep_last_periodic: 2}
artifacts: {runs_dir: runs, dataset_manifest: data/personal/encoded/manifests/personal-dataset-REPLACE.json, replay_manifest: null, league_manifest: null}
personalization:
  base_export: artifacts/personal_supervised
  dataset_manifest: data/personal/encoded/manifests/personal-dataset-REPLACE.json
  sample_kind_weights: {good_move: 0.75, full_game: 1.0}
  max_positions_per_game: 16
  policy_loss_weight: 1.0
  value_loss_weight: 0.25
  max_epochs: 20
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  validation_every_epochs: 1
  selection_metric: policy_cross_entropy
  batch_size: 128
  cache_segments: 2
human_feedback:
  enabled: true
  dataset_manifest: data/human_feedback_encoded/manifests/feedback-dataset-REPLACE.json
  sample_weight: 4.0
  max_batch_fraction: 0.25
  max_positions_per_game: 16
  cache_segments: 1
  historical_regression_tolerance: 0.01
  feedback_min_delta: 0.0001
