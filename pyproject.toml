[project]
name = "chessy"
version = "0.1.0"
description = "A personal self-learning and personalized chess bot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-chess==1.999",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessy"]
